name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          use-lto: false

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: PredictiveBuffer-2.2091
          path: ${{ github.workspace }}/**/*.geode

      - name: Publish .geode to the build branch
        shell: bash
        run: |
          f=$(find "$GITHUB_WORKSPACE" -name '*.geode' | head -1)
          mkdir -p /tmp/out && cp "$f" /tmp/out/ai.predictivebuffer.geode
          cd /tmp/out
          git init -q -b build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai.predictivebuffer.geode
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build
